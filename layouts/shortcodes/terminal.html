<!-- 神秘的終端 -->

<script src="/js/base64.js"></script>
<script src="/js/md5.js"></script>
<script src="/js/terminal.js"></script>
<div id="terminal">
  <div id="output"></div>
  <div id="input-line" class="input-line">
    <div id="prompt" class="prompt-color"></div>
    &nbsp;
    <div>
      <!-- aria-label：這個輸入框視覺上只靠前面的 prompt 表示用途，沒有 <label>，
           讀螢幕軟體會報成沒有名字的欄位（Lighthouse: label）。 -->
      <input
        type="text"
        id="cmdline"
        aria-label="終端機指令輸入"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      />
    </div>
  </div>
</div>

<style>
  #terminal {
    padding: 1em;
    background-color: #1e1e1e;
    color: #dcdfe4;
    font-family: "Fira Code", "Hack", "Menlo", "Monaco", monospace;
    font-size: 14px;
    line-height: 1.5;
    border: 5px solid #3b3b3b;
    border-radius: 4px;
    min-height: 300px;
    position: relative;
  }
  #output {
    white-space: pre-wrap;
    word-break: break-all;
  }
  #cmdline {
    outline: none;
    background-color: transparent;
    margin: 0;
    padding: 0;
    border: none;
    color: inherit;
    font: inherit;
    width: 100%;
    caret-color: #dcdfe4;
  }
  .input-line {
    display: -webkit-box;
    -webkit-box-orient: horizontal;
    -webkit-box-align: stretch;
    display: -moz-box;
    -moz-box-orient: horizontal;
    -moz-box-align: stretch;
    display: box;
    box-orient: horizontal;
    box-align: stretch;
    clear: both;
  }

  .input-line > div:nth-child(2) {
    -webkit-box-flex: 1;
    -moz-box-flex: 1;
    box-flex: 1;
  }

  #prompt {
    color: #8be9fd;
    font-weight: bold;
    white-space: nowrap;
  }
</style>
